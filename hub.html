<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ระบบของครูปรัชญา</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Nunito:wght@600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="css">
/* Layout: soft pastel teacher dashboard. Frosted sidebar menu | top bar, blossom banner, icon-tile board, today's classes + month calendar */
:root{
  --bg1:#fdeef3; --bg2:#f8f0f8; --bg3:#eef2fb;
  --glass:rgba(255,255,255,.78); --surface:#ffffff; --sunk:#f7f1f6; --line:#f0e3ec;
  --ink:#3d3552; --muted:#8a8199; --rose:#e8789c; --rose-deep:#d45a83; --rose-soft:#fde3ec; --rose-ink:#ffffff;
  --today:#ef8fae; --bad:#c8312a;
  --tb:97%; --tf:89%; --ts:55%; --tsl:56%; --tline:92%;
  --shadow:0 1px 2px rgba(150,90,120,.05),0 10px 30px rgba(150,90,120,.08);
  --shadow-hi:0 2px 6px rgba(150,90,120,.08),0 18px 40px rgba(150,90,120,.16);
  --f-display:"Prompt","Sarabun",system-ui,sans-serif;
  --f-latin:"Nunito","Prompt",system-ui,sans-serif;
  --f-body:"Sarabun","Prompt","Leelawadee UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg1:#241a2b; --bg2:#1e1a2e; --bg3:#191c2e;
  --glass:rgba(40,32,54,.82); --surface:#2b2340; --sunk:#241d36; --line:#3e3356;
  --ink:#f3ecf7; --muted:#b8aec8; --rose:#f49ab8; --rose-deep:#ffb3ca; --rose-soft:#4a2a3d; --rose-ink:#2a1020;
  --today:#e8789c; --bad:#ff8f86;
  --tb:22%; --tf:34%; --ts:45%; --tsl:78%; --tline:30%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --shadow-hi:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg1:#241a2b; --bg2:#1e1a2e; --bg3:#191c2e;
  --glass:rgba(40,32,54,.82); --surface:#2b2340; --sunk:#241d36; --line:#3e3356;
  --ink:#f3ecf7; --muted:#b8aec8; --rose:#f49ab8; --rose-deep:#ffb3ca; --rose-soft:#4a2a3d; --rose-ink:#2a1020;
  --today:#e8789c; --bad:#ff8f86;
  --tb:22%; --tf:34%; --ts:45%; --tsl:78%; --tline:30%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --shadow-hi:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%) fixed;color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 100px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}

/* icons */
.fi{display:block}
.fi .f{fill:hsl(var(--h) 90% var(--tf));stroke:hsl(var(--h) var(--ts) var(--tsl));stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.fi .s{fill:none;stroke:hsl(var(--h) var(--ts) var(--tsl));stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.fi .d{fill:hsl(var(--h) var(--ts) var(--tsl));stroke:none}
.fi .w{fill:var(--surface);stroke:hsl(var(--h) var(--ts) var(--tsl));stroke-width:2.4;stroke-linejoin:round}
.fi text{fill:hsl(var(--h) var(--ts) var(--tsl));font-family:"Nunito",sans-serif;font-weight:800}

/* sidebar */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 18px);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:20px 12px;display:grid;gap:14px}
.logo{display:grid;justify-items:center;gap:6px;padding:4px 6px 14px;border-bottom:1px solid var(--line);text-align:center}
.logo .em{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 4px var(--rose-soft)}
.logo .em img{width:100%;height:100%;object-fit:contain}
.logo .em svg{width:64px;height:64px}
.logo small{font-size:12.5px;color:var(--muted);line-height:1.35}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:9px 12px;border-radius:14px;cursor:pointer;text-align:left;font-family:var(--f-display);font-size:14.5px;color:var(--ink)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--rose-soft);color:var(--rose-deep);font-weight:500}
.nav .fi{width:26px;height:26px;flex:none}
.nav .n{margin-left:auto;font-family:var(--f-latin);font-weight:800;font-size:12px;color:var(--muted)}

/* top */
.main{display:grid;gap:18px;min-width:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .ttl{flex:1 1 220px;min-width:0}
.top h1{font-family:var(--f-latin);font-weight:800;font-size:clamp(22px,3vw,28px);margin:0;line-height:1.2}
.top h1 span{font-family:var(--f-display);font-weight:600}
.tagline{font-size:13.5px;color:var(--muted);font-family:var(--f-latin);font-weight:600}
.search{position:relative;flex:0 1 300px;min-width:200px}
.search input{width:100%;padding:11px 16px 11px 42px;border:1px solid var(--line);border-radius:999px;background:var(--glass);font-size:15px;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px var(--rose-soft)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}
.me{width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--rose-soft);border:3px solid var(--surface);box-shadow:var(--shadow);flex:none;display:grid;place-items:center}
.me img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.me span{font-family:var(--f-display);font-weight:600;color:var(--rose-deep)}

/* banner */
.banner{position:relative;border-radius:26px;overflow:hidden;min-height:210px;box-shadow:var(--shadow);background:linear-gradient(120deg,#fde4ee 0%,#fbeaf3 40%,#f6e9f6 70%,#e9eefb 100%);display:flex;align-items:center}
.banner .art{position:absolute;inset:0;width:100%;height:100%}
.banner .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,246,250,.94) 0%,rgba(255,246,250,.82) 38%,rgba(255,246,250,0) 70%)}
.banner .txt{position:relative;padding:26px 30px;max-width:520px;display:grid;gap:6px;color:#3d3552}
.banner .hello{font-family:var(--f-latin);font-weight:800;font-size:clamp(24px,3.4vw,34px);line-height:1.15}
.banner .nm{font-family:var(--f-display);font-weight:500;font-size:16px;color:#b04a72}
.banner .q{font-family:var(--f-display);font-size:15px;color:#6e6182}
.banner .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.banner .tag{font-size:12.5px;font-family:var(--f-display);padding:2px 11px;border-radius:999px;background:rgba(255,255,255,.85);color:#7a5a76;border:1px solid #f3d6e3}

/* board */
.panel{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:20px;display:grid;gap:18px;min-width:0}
.phead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.phead h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.phead .en{font-family:var(--f-latin);font-weight:700;font-size:13px;color:var(--muted)}
.phead .sp{flex:1}
.gsec{display:grid;gap:12px}
.gsec h3{display:flex;align-items:center;gap:8px;margin:0;font-family:var(--f-display);font-weight:500;font-size:15.5px;color:var(--muted)}
.gsec h3 .fi{width:22px;height:22px}
.gsec h3 .n{font-family:var(--f-latin);font-weight:800;font-size:12px}
.gsec h3 .tools{margin-left:auto;display:flex}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,158px),1fr));gap:14px}
.tile{position:relative;display:grid;justify-items:center;align-content:start;gap:8px;text-align:center;padding:18px 12px 16px;border-radius:20px;background:hsl(var(--h) 85% var(--tb));border:1px solid hsl(var(--h) 60% var(--tline));text-decoration:none;color:var(--ink);min-width:0;transition:transform .18s,box-shadow .18s}
a.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
.tile .fi{width:56px;height:56px;transition:transform .18s}
a.tile:hover .fi{transform:scale(1.08)}
.tile .ph{width:64px;height:56px;border-radius:12px;object-fit:cover}
.tile b{font-family:var(--f-display);font-weight:500;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.tile .d{font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.nolink{background:var(--surface);border-style:dashed}
.tile.nolink .fi{opacity:.55}
.tile .soon{font-size:11.5px;color:var(--muted);background:var(--sunk);padding:1px 9px;border-radius:999px}
.tile .ed{position:absolute;top:6px;right:6px;left:6px;display:flex;justify-content:space-between}
.tile .ed button{border:0;background:var(--surface);border-radius:999px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;color:var(--muted);box-shadow:var(--shadow)}
.tile .ed button:hover{color:var(--rose-deep)}
.tile .ed svg,.ib svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile.edit{padding-top:40px}
.addtile{border:2px dashed var(--line);border-radius:20px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;align-content:center;gap:4px;min-height:140px;font-family:var(--f-display);font-size:14px}
.addtile:hover{border-color:var(--rose);color:var(--rose-deep)}
.addtile svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.empty{border:2px dashed var(--line);border-radius:20px;padding:26px;color:var(--muted);text-align:center}

/* today + calendar */
.duo{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.cls{display:grid;gap:4px}
.crow{display:grid;grid-template-columns:62px 72px minmax(0,1fr);gap:10px;align-items:center;padding:9px 12px;border-radius:14px}
.crow:nth-child(odd){background:var(--sunk)}
.crow .tm{font-family:var(--f-latin);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.crow .cl{font-family:var(--f-display);font-weight:500}
.crow .sj{min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .sj small{color:var(--muted)}
.crow.act .cl,.crow.act .sj{color:var(--muted)}
.crow.now{background:var(--rose-soft)!important;box-shadow:inset 3px 0 0 var(--rose)}
.crow.now .tm{color:var(--rose-deep)}
.note{font-size:13px;color:var(--muted);margin:0}
.cal{display:grid;gap:10px}
.calh{display:flex;align-items:center;gap:8px}
.calh b{font-family:var(--f-display);font-weight:600;font-size:17px;flex:1}
.ib{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.ib:hover{color:var(--rose-deep);background:var(--rose-soft)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid7 .dn{font-size:12px;color:var(--muted);font-family:var(--f-display);padding-bottom:4px}
.grid7 .dn:first-child,.grid7 .dn:last-child{color:var(--rose)}
.grid7 .dd{font-family:var(--f-latin);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;padding:7px 0;border-radius:10px}
.grid7 .dd.wk{color:var(--muted)}
.grid7 .dd.td{background:var(--today);color:#fff}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;font-family:var(--f-display);font-weight:500;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);box-shadow:var(--shadow)}
.btn:hover{border-color:var(--rose)}
.btn.pri{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.btn.on{background:var(--rose-deep);border-color:var(--rose-deep);color:var(--rose-ink)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted);padding:6px 10px}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad);box-shadow:none}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* save bar + modal */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
.savebar>div{pointer-events:auto;background:var(--ink);color:var(--bg1);border-radius:999px;padding:8px 8px 8px 22px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-hi);flex-wrap:wrap;max-width:100%}
.savebar .btn{background:var(--rose);color:var(--rose-ink);border-color:var(--rose);box-shadow:none}
.savebar .btn.ghost{background:transparent;border-color:transparent;color:var(--bg1)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(60,40,60,.45);display:grid;place-items:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border-radius:26px;width:min(580px,100%);padding:24px;display:grid;gap:14px;box-shadow:var(--shadow-hi)}
.dlg h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.fld{display:grid;gap:6px}
.fld>label{font-size:13.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:14px;padding:10px 13px;background:var(--sunk);width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--rose);outline:none;box-shadow:0 0 0 3px var(--rose-soft)}
.fld textarea{min-height:68px;resize:vertical}
.err{color:var(--bad);font-size:13px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:200px;overflow-y:auto;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--sunk)}
.picker button{border:2px solid transparent;background:var(--surface);border-radius:12px;padding:6px;cursor:pointer;display:grid;place-items:center}
.picker button .fi{width:32px;height:32px}
.picker button[aria-pressed="true"]{border-color:var(--rose)}
.picker .txt{font-family:var(--f-display);font-size:12px;color:var(--muted);min-height:48px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;background:hsl(var(--h) 85% 80%)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px hsl(var(--h) 60% 55%)}
.upl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.upl input{padding:6px;font-size:13px;border:0;background:none}
.upl img{width:56px;height:40px;object-fit:cover;border-radius:8px}
.btns{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.btns>div{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:980px){
  .wrap{grid-template-columns:1fr}
  .side{position:static;padding:10px;display:flex;align-items:center;gap:10px;border-radius:20px}
  .logo{display:flex;border:0;padding:0;gap:8px}
  .logo .em{width:44px;height:44px;box-shadow:0 0 0 3px var(--rose-soft)}
  .logo .em svg{width:34px;height:34px}
  .logo small{display:none}
  .nav{display:flex;overflow-x:auto;gap:4px;scrollbar-width:none;flex:1;min-width:0}
  .nav button{flex:none;padding:8px 12px}
  .nav .n{display:none}
  .duo{grid-template-columns:1fr}
}
@media (max-width:560px){
  .banner .veil{background:linear-gradient(180deg,rgba(255,246,250,.92) 0%,rgba(255,246,250,.75) 70%,rgba(255,246,250,.4) 100%)}
  .banner .txt{padding:22px 20px}
  .panel{padding:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}a.tile:hover{transform:none}}
</style>
</head>
