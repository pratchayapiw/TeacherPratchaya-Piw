<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal</title><link rel="stylesheet" href="style.css"></head><body><div class="rainbow"></div><header class="top"><div class="topin"><div class="brand"><img class="avatar" src="profile.jpeg" data-avatar><div><b>Student Portal</b><small>Smart Scorebook</small></div></div><a class="btn btn-outline" href="index.html">ออกจากระบบ</a></div></header><div class="container"><div class="hero"><div class="between"><div><h1>ผลการเรียนของฉัน</h1><p>ข้อมูลตัวอย่างสำหรับนักเรียน M.3/1</p></div><span id="visibility" class="badge"></span></div></div><div style="height:16px"></div><div id="app"></div></div><script>
const KEY="smartScorebookDataV5";
const defaultData={profile:{nameEn:"Pratchaya Songbanpot",nameTh:"นางสาวปรัชญา ทรงบรรพต",nickname:"ครูปิ้วน่ารัก",role:"Teacher / Admin",photo:"profile.jpeg"},settings:{graceDays:2,deductionPerDay:1,deductionCap:5,resultVisible:true},students:[{id:"s1",name:"Aom",class:"M.3/1",no:1,score:86,attendance:96,pending:0},{id:"s2",name:"Beam",class:"M.3/1",no:2,score:74,attendance:92,pending:1},{id:"s3",name:"Cream",class:"M.3/1",no:3,score:48,attendance:88,pending:0},{id:"s4",name:"Dew",class:"M.3/1",no:4,score:61,attendance:55,pending:2}],assignments:[{id:"a1",title:"Green Hero Worksheet",class:"M.3/1",max:10,due:"2026-09-18",status:"pending"},{id:"a2",title:"Speaking Practice",class:"M.3/1",max:20,due:"2026-09-20",status:"submitted"}]};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultData)}catch(e){return structuredClone(defaultData)}}function save(d){localStorage.setItem(KEY,JSON.stringify(d))}function data(){let d=load();if(!d.profile.photo)d.profile.photo="profile.jpeg";return d}
function grade(p){if(p>=80)return"4.0";if(p>=75)return"3.5";if(p>=70)return"3.0";if(p>=65)return"2.5";if(p>=60)return"2.0";if(p>=55)return"1.5";if(p>=50)return"1.0";return"0"}
function risk(s){let r=[];if(s.score<50)r.push("เสี่ยง 0");if(s.pending>0)r.push("ร");if(s.attendance<60)r.push("มส");return r}
function avatar(){let d=data();document.querySelectorAll("[data-avatar]").forEach(x=>x.src=d.profile.photo)}function profileText(){let d=data();document.querySelectorAll("[data-name-en]").forEach(x=>x.textContent=d.profile.nameEn);document.querySelectorAll("[data-name-th]").forEach(x=>x.textContent=d.profile.nameTh);document.querySelectorAll("[data-nick]").forEach(x=>x.textContent=d.profile.nickname)}function init(){avatar();profileText()}
function flash(msg,type="ok"){let e=document.getElementById("flash");if(!e)return;e.textContent=msg;e.className="badge "+type;e.style.display="inline-flex";setTimeout(()=>e.style.display="none",2200)}

function render(){let d=data(),s=d.students[1],app=document.getElementById("app");if(!d.settings.resultVisible){app.innerHTML='<div class="card"><h2>ครูยังไม่เปิดให้แสดงผลการเรียน</h2><p class="muted">ขณะนี้นักเรียนสามารถเข้าดูระบบได้ แต่คะแนนและเกรดยังถูกซ่อนไว้</p></div>';document.getElementById("visibility").textContent="ผลการเรียน: ปิด";document.getElementById("visibility").className="badge warn";return}let rr=risk(s);document.getElementById("visibility").textContent="ผลการเรียน: เปิด";document.getElementById("visibility").className="badge ok";app.innerHTML='<div class="grid g4"><div class="card stat" style="--accent:var(--pink)"><div class="muted">คะแนนรวม</div><div class="num">'+s.score+'%</div></div><div class="card stat" style="--accent:var(--green)"><div class="muted">เกรด</div><div class="num">'+grade(s.score)+'</div></div><div class="card stat" style="--accent:var(--blue)"><div class="muted">การเข้าเรียน</div><div class="num">'+s.attendance+'%</div></div><div class="card stat" style="--accent:var(--yellow)"><div class="muted">งานค้าง</div><div class="num">'+s.pending+'</div></div></div><div style="height:16px"></div><div class="grid g2"><section class="card"><div class="between"><h2>สถานะ</h2><div>'+(rr.length?rr.map(x=>'<span class="badge danger">'+x+'</span>').join(" "):'<span class="badge ok">ปกติ</span>')+'</div></div><p class="muted">ระบบคำนวณจากคะแนน การส่งงาน และการเข้าเรียน</p></section><section class="card"><h2>งานที่ต้องติดตาม</h2>'+d.assignments.map(a=>'<div class="between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>'+a.title+'<br><small class="muted">กำหนดส่ง '+a.due+' · '+a.max+' คะแนน</small></span><span class="badge '+(a.status==="submitted"?"ok":"warn")+'">'+(a.status==="submitted"?"ส่งแล้ว":"รอส่ง")+'</span></div>').join("")+'</section></div>'}
init();render()</script></body></html>
